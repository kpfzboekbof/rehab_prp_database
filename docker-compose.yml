services:
  prp-dashboard:
    build: .
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=file:/app/data/prp.db
      - AUTH_SECRET=${AUTH_SECRET}
      - AUTH_TRUST_HOST=true
      - SEED_ADMIN_EMAIL=${SEED_ADMIN_EMAIL:-admin@clinic.local}
      - SEED_ADMIN_PASSWORD=${SEED_ADMIN_PASSWORD:-changeme}
      - SEED_ADMIN_NAME=${SEED_ADMIN_NAME:-管理員}
    volumes:
      - ./data:/app/data
    restart: unless-stopped
